[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pass-field-check"
version = "0.1.0"
description = "用药字段对照工作台 — 院内合理用药规则 markdown 索引与审方字段秒级命中"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ChaosForge" },
]
dependencies = [
  "pyyaml>=6.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "httpx>=0.27.0",
  "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
pass-fc = "pass_field_check.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pass_field_check*"]

[tool.setuptools.package-data]
"pass_field_check" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"